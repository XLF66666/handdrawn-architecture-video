  /* ---- 动画基元 ---- */
  /* dasharray 需 ≥ 最大框周长(外舞台主框 5240 / 虚线框 5176)，否则动画前框线提前露出 */
  .draw { stroke-dasharray:5400; stroke-dashoffset:5400; animation:draw .9s ease-in-out var(--d,0s) forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .draw-sm { stroke-dasharray:5400; stroke-dashoffset:5400; animation:draw .7s ease-in-out var(--d,0s) forwards; }
  .fillin { opacity:0; animation:fillin .5s ease-out var(--d,0s) forwards; }
  @keyframes fillin { to { opacity:1; } }
  .fu { opacity:0; animation:fu .5s ease-out var(--d,0s) forwards; }
  @keyframes fu { from { opacity:0; translate:0 12px; } to { opacity:1; translate:0 0; } }
  .fade { opacity:0; animation:fade .5s ease-out var(--d,0s) forwards; }
  @keyframes fade { to { opacity:1; } }
  .dot { opacity:0; animation:dotIn .3s linear var(--d,0s) forwards; }
  @keyframes dotIn { to { opacity:1; } }

  text { font-family:"Kaiti SC","KaiTi","STKaiti","Segoe Print",cursive; }
  .w{fill:#2E2A45}.m{fill:#6E6784}.d{fill:#9A91AE}.p{fill:#6D5CE0}.b{fill:#3E6BD8}.t{fill:#2E9E8B}.a{fill:#C77D1E}
  .cap{font-size:15px;font-weight:600;letter-spacing:2px}.h1{font-size:40px;font-weight:600}.h2{font-size:25px;font-weight:600}
  .title{font-size:20px;font-weight:600}.body{font-size:15px}.tiny{font-size:13px}.micro{font-size:12px}

  .legend { position:absolute; left:12px; bottom:10px; font-size:13px; color:#9a8fae; user-select:none; }
  .loop-note { position:absolute; right:12px; bottom:10px; font-size:13px; color:#b4a9c9; user-select:none; }
</style>
