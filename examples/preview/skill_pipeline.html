<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#FBF7EF; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:"KaiTi","Kaiti SC","STKaiti","Microsoft YaHei",serif; }
  .stage { position:relative; width:min(100vw, calc(100vh * 1.7778)); }
  svg { width:100%; height:auto; display:block; }

  /* ---- 动画基元 ---- */
  .draw { stroke-dasharray:3400; stroke-dashoffset:3400; animation:draw .8s ease-in-out var(--d,0s) forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .draw-sm { stroke-dasharray:2400; stroke-dashoffset:2400; animation:draw .7s ease-in-out var(--d,0s) forwards; }
  .fillin { opacity:0; animation:fillin .5s ease-out var(--d,0s) forwards; }
  @keyframes fillin { to { opacity:1; } }
  .fu { opacity:0; animation:fu .5s ease-out var(--d,0s) forwards; }
  @keyframes fu { from { opacity:0; translate:0 12px; } to { opacity:1; translate:0 0; } }
  .up { opacity:0; animation:up .6s ease-out var(--d,0s) forwards; }
  @keyframes up { from { opacity:0; translate:0 40px; } to { opacity:1; translate:0 0; } }
  .fade { opacity:0; animation:fade .5s ease-out var(--d,0s) forwards; }
  @keyframes fade { to { opacity:1; } }
  .dot { opacity:0; animation:dotIn .3s linear var(--d,0s) forwards; }
  @keyframes dotIn { to { opacity:1; } }

  text { font-family:"KaiTi","Kaiti SC","STKaiti","Microsoft YaHei",serif; fill:#2E2A45; }
  .sans{font-family:"Segoe UI","Microsoft YaHei",sans-serif}
  .cap{font-size:18px;font-weight:700;letter-spacing:2.4px}
  .headline{font-size:52px;font-weight:700;letter-spacing:2px}

  .stepTitle{font-size:26px;font-weight:700}
  .stepEn{font-size:15px;font-weight:700;letter-spacing:2px}
  .body{font-size:17px;fill:#6E6784}
  .mini{font-size:15px;fill:#6E6784}
  .purple{fill:#6D5CE0}.blue{fill:#3E6BD8}.teal{fill:#2E9E8B}.amber{fill:#C77D1E}
  .ink{stroke:#3A3650;stroke-linecap:round;stroke-linejoin:round}

  .legend { position:absolute; left:12px; bottom:10px; font-size:13px; color:#9a8fae; user-select:none; }
</style>
</head>
