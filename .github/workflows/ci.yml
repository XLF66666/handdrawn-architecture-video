# ============================================================
# CI — 每次 push / PR 自动运行 selfcheck.py
# runner 用 windows-latest：自带 Windows PowerShell 5.1，
# 满足 selfcheck 对 export_4k.ps1 的 BOM + 语法解析检查。
# 用法：推送本仓库到 GitHub 即自动生效（Gitee 可用 Gitee Go 等效配置）。
# ============================================================
name: selfcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selfcheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Print environment & file inventory (diagnostics)
        run: |
          python --version
          node --version
          echo "--- git status ---"
          git status --short
          echo "--- scripts/ ---"
          ls scripts/
          echo "--- examples/ ---"
          ls examples/

      - name: Run selfcheck (full output)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/selfcheck.py . 2>&1 | tee selfcheck.log
          echo "selfcheck_exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Get-Content selfcheck.log | ForEach-Object { echo "::error::$($_)" } }
          exit $LASTEXITCODE

      - name: Verify capture.js syntax
        run: node --check scripts/capture.js
